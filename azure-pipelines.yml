# Pull request validation: docker build and the Playwright suite of the reference demo (merch-react-router, its `main`)
# against the built container and the real Delivery API. Not triggered by this file (`trigger: none`): the
# build-validation policy on `main` queues it for every PR and makes it a blocking check. The variable group
# `merch-vue-nuxt` holds NOVA_DELIVERY_URL, NOVA_DELIVERY_USER and NOVA_DELIVERY_PASSWORD (secret; a secret reaches a
# script only through `env:`). Shopify is not configured here: the site renders no buy button and no cart, and the tests
# tagged @shopify run locally only.
trigger: none

resources:
  repositories:
    - repository: suite
      type: git
      name: merch-react-router
      ref: main

pool:
  vmImage: ubuntu-latest

variables:
  - group: merch-vue-nuxt
  - name: PORT
    value: 3000

steps:
  - checkout: self
  - checkout: suite

  # Rules of the pull request itself (branch name, linked work item, merge commit message and its text): scripts/check-pull-request.py.
  # The secure file lists terms the public commit message must not contain; it is not part of any repository.
  - task: DownloadSecureFile@1
    name: termlist
    displayName: Download the list of terms a commit message must not contain
    condition: eq(variables['Build.Reason'], 'PullRequest')
    inputs:
      secureFile: pr-text-denylist.txt

  - script: python3 scripts/check-pull-request.py --denylist "$(termlist.secureFilePath)"
    displayName: Check the pull request
    condition: eq(variables['Build.Reason'], 'PullRequest')
    workingDirectory: $(Pipeline.Workspace)/s/merch-vue-nuxt
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - script: docker build -t merch-vue-nuxt:$(Build.BuildId) .
    displayName: Build the Docker image
    workingDirectory: $(Pipeline.Workspace)/s/merch-vue-nuxt

  - script: |
      docker run -d --name site -p $(PORT):3000 \
        -e NOVA_DELIVERY_URL -e NOVA_DELIVERY_USER -e NOVA_DELIVERY_PASSWORD \
        merch-vue-nuxt:$(Build.BuildId)
    displayName: Start the site
    env:
      NOVA_DELIVERY_URL: $(NOVA_DELIVERY_URL)
      NOVA_DELIVERY_USER: $(NOVA_DELIVERY_USER)
      NOVA_DELIVERY_PASSWORD: $(NOVA_DELIVERY_PASSWORD)

  - script: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null http://localhost:$(PORT)/de/
    displayName: Wait for the site

  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: 24.x

  - script: npm ci
    displayName: Install the suite
    workingDirectory: $(Pipeline.Workspace)/s/merch-react-router

  - script: npx playwright install --with-deps chromium
    displayName: Install Chromium for Playwright
    workingDirectory: $(Pipeline.Workspace)/s/merch-react-router

  # No retries: a red test is a finding. The paths the tests use are CMS data. The only tests left out are the ones
  # tagged @shopify (Shopify is tested locally until further notice).
  - script: npx playwright test --grep-invert @shopify --reporter=line,junit
    displayName: Playwright suite (Chromium, without @shopify)
    workingDirectory: $(Pipeline.Workspace)/s/merch-react-router
    env:
      BASE_URL: http://localhost:$(PORT)
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: $(Pipeline.Workspace)/s/merch-react-router/test-results/junit.xml

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(Pipeline.Workspace)/s/merch-react-router/test-results/junit.xml
      testRunTitle: Playwright (Chromium)
      failTaskOnFailedTests: false  # the Playwright step already fails the run

  - script: |
      mkdir -p $(Build.ArtifactStagingDirectory)/failure-output
      docker logs site > $(Build.ArtifactStagingDirectory)/failure-output/server.log 2>&1 || true
      cp -r $(Pipeline.Workspace)/s/merch-react-router/test-results $(Build.ArtifactStagingDirectory)/failure-output/ || true
    displayName: Collect test output and server log
    condition: failed()

  - task: PublishPipelineArtifact@1
    displayName: Publish test output and server log
    condition: failed()
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/failure-output
      artifactName: failure-output
